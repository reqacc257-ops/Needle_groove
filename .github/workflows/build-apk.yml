name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the Android SDK command-line tools and accepts the licenses so
      # Gradle can fetch compileSdk 36 and the build-tools on its own.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeedleGroove-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
